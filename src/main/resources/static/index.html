<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindh Free Literacy & AI Academy</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: sans-serif; margin: 0; padding-bottom: 40px; }
        header { background: linear-gradient(to right, #f59e0b, #dc2626); padding: 20px; text-align: center; }
        main { max-width: 800px; margin: 0 auto; padding: 20px; }
        .stats { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .form-sec { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; color: white; box-sizing: border-box; }
        .btn-sub { width: 100%; background: #059669; color: white; font-weight: bold; padding: 10px; border: none; border-radius: 6px; cursor: pointer; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .tabs button { background: #1e293b; border: 1px solid #334155; color: white; padding: 6px 16px; border-radius: 6px; cursor: pointer; }
        .tabs button.active { background: #fbbf24; color: #0f172a; }
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .card-hd { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.8rem; }
        .tag { color: #fbbf24; font-weight: bold; }
        .btn-del { background: none; border: none; color: #64748b; cursor: pointer; font-weight: bold; }
        .btn-del:hover { color: #ef4444; }
        .tip { background: rgba(251,191,36,0.1); border: 1px solid rgba(251,191,36,0.2); color: #fde047; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>
<header>
    <h1>HALA LITERACY ACADEMY</h1>
    <p>Empowering the youth of Sindh with Free English, AI & Digital Skills 🌟</p>
</header>
<main>
    <div class="stats">
        <div><small style="color:#94a3b8">PLATFORM CURRENCY STATUS</small><div id="exchangeStatus" style="font-weight:bold;color:#fbbf24;margin-top:4px">Loading...</div></div>
        <div style="background:#334155;padding:6px;border-radius:6px;text-align:center;font-weight:bold;color:#10b981">FREE</div>
    </div>
    <div class="form-sec">
        <h3 style="margin-top:0;color:#fbbf24">➕ Add New Academy Lesson</h3>
        <form onsubmit="createNewLesson(event)">
            <div class="form-row">
                <select id="formCategory" style="flex:1"><option value="English">English</option><option value="AI">AI</option><option value="Earning">Earning</option></select>
                <input type="text" id="formTitle" style="flex:2" required placeholder="Lesson Topic / Title">
            </div>
            <textarea id="formContent" required rows="2" placeholder="Lesson content text..." style="margin-bottom:10px"></textarea>
            <input type="text" id="formTip" required placeholder="Interactive student tip..." style="margin-bottom:10px">
            <button type="submit" class="btn-sub">🚀 Publish Lesson</button>
        </form>
    </div>
    <div class="tabs">
        <button onclick="loadLessons('', this)" class="active">All Courses</button>
        <button onclick="loadLessons('English', this)">English</button>
        <button onclick="loadLessons('AI', this)">AI</button>
        <button onclick="loadLessons('Earning', this)">Earning</button>
    </div>
    <div id="lessonsGrid" class="grid"></div>
</main>
<script>
    fetch('/api/convert?usd=1').then(res=>res.json()).then(d=>{document.getElementById('exchangeStatus').innerText=`$1.00 USD = ${d.convertedPkr} PKR`;});
    function loadLessons(cat, btn) {
        if(btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');}
        fetch(`/api/lessons?category=${cat}`).then(res=>res.json()).then(data=>{
            const g = document.getElementById('lessonsGrid'); g.innerHTML = '';
            data.forEach(l=>{
                g.innerHTML += `<div class="card"><div class="card-hd"><span class="tag">${l.category}</span><button onclick="deleteLesson(${l.id})" class="btn-del">✕ Delete</button></div><h3 style="margin:0 0 8px 0">${l.title}</h3><p style="color:#cbd5e1;font-size:0.9rem;margin:0 0 10px 0">${l.content}</p><div class="tip">💡 ${l.interactiveTip}</div></div>`;
            });
        });
    }
    function createNewLesson(e) {
        e.preventDefault();
        const cat = document.getElementById('formCategory').value, t = document.getElementById('formTitle').value, c = document.getElementById('formContent').value, tp = document.getElementById('formTip').value;
        fetch(`/api/lessons/add?category=${encodeURIComponent(cat)}&title=${encodeURIComponent(t)}&content=${encodeURIComponent(c)}&tip=${encodeURIComponent(tp)}`).then(res=>res.json()).then(()=>{
            document.getElementById('formTitle').value=''; document.getElementById('formContent').value=''; document.getElementById('formTip').value='';
            loadLessons(document.querySelector('.tabs button.active').innerText.replace('All Courses',''), document.querySelector('.tabs button.active'));
        });
    }
    function deleteLesson(id) {
        if(confirm("Remove this lesson?")) {
            fetch(`/api/lessons/delete?id=${id}`).then(res=>res.json()).then(()=>{
                loadLessons(document.querySelector('.tabs button.active').innerText.replace('All Courses',''), document.querySelector('.tabs button.active'));
            });
        }
    }
    loadLessons('');
</script>
</body>
</html>
