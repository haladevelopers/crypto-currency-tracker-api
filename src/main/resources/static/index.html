<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindh Free Literacy & AI Academy</title>
    <style>
        body { background:#0f172a; color:#fff; font-family:sans-serif; margin:0; padding-bottom:40px; }
        header { background:linear-gradient(to right, #f59e0b, #dc2626); padding:20px; text-align:center; }
        main { max-width:800px; margin:0 auto; padding:20px; }
        .stats { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:15px; margin-bottom:20px; display:flex; justify-content:space-between; }
        .form-sec { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:20px; margin-bottom:20px; }
        .form-row { display: flex; gap:10px; margin-bottom:10px; }
        input, select, textarea { width:100%; background:#0f172a; border:1px solid #334155; border-radius:6px; padding:8px; color:#fff; box-sizing:border-box; outline:none; }
        .btn-sub { width:100%; background:#059669; color:#fff; font-weight:bold; padding:12px; border:none; border-radius:6px; cursor:pointer; }
        .tabs { display:flex; gap:10px; margin-bottom:20px; overflow-x:auto; border-b:1px solid #334155; padding-bottom:10px; }
        .tabs button { background:#1e293b; border:1px solid #334155; color:#fff; padding:6px 16px; border-radius:6px; cursor:pointer; }
        .tabs button.active { background:#fbbf24; color:#0f172a; font-weight:bold; }
        .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
        .card { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
        .card-hd { display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem; }
        .tag { color:#fbbf24; font-weight:bold; text-transform:uppercase; }
        .btn-del { background:none; border:none; color:#64748b; cursor:pointer; font-weight:bold; }
        .btn-del:hover { color:#ef4444; }
        .tip { background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.2); color:#fde047; padding:10px; border-radius:6px; font-size:0.85rem; margin-top:10px; }
        .qz { background:#0f172a; padding:12px; border-radius:6px; border:1px solid #475569; margin-top:10px; }
        .qz-opt { width:100%; text-align:left; background:#1e293b; border:1px solid #475569; padding:8px; color:#fff; border-radius:4px; margin-top:6px; cursor:pointer; font-size:0.85rem; }
        .qz-fb { font-size:0.85rem; font-weight:bold; margin-top:8px; padding:6px; border-radius:4px; display:none; }
    </style>
</head>
<body>
<header>
    <h1>HALA LITERACY ACADEMY</h1>
    <p>Empowering the youth of Sindh with Free English, AI & Digital Skills 🌟</p>
</header>
<main>
    <div class="stats">
        <div><small style="color:#94a3b8">PLATFORM CURRENCY STATUS</small><div id="exchangeStatus" style="font-weight:bold;color:#fbbf24">Loading...</div></div>
        <div style="background:#334155;padding:6px;border-radius:6px;color:#10b981;font-weight:bold">FREE</div>
    </div>
    <div class="form-sec">
        <h3 style="margin:0 0 10px 0;color:#fbbf24">➕ Add New Academy Lesson & Quiz</h3>
        <form onsubmit="createNewLesson(event)">
            <div class="form-row">
                <!-- Category options unified to match database state queries -->
                <select id="formCategory" style="flex:1">
                    <option value="English">English</option>
                    <option value="AI">AI</option>
                    <option value="Earning">Earning</option>
                </select>
                <input type="text" id="formTitle" style="flex:2" required placeholder="Lesson Topic / Title">
            </div>
            <textarea id="formContent" required rows="2" placeholder="Lesson content details..." style="margin-bottom:10px"></textarea>
            <input type="text" id="formTip" required placeholder="Interactive teacher tip..." style="margin-bottom:10px">
            <input type="text" id="qzQ" required placeholder="Quiz Question..." style="margin-bottom:10px">
            <div class="form-row">
                <input type="text" id="o0" required placeholder="Option 1">
                <input type="text" id="o1" required placeholder="Option 2">
                <input type="text" id="o2" required placeholder="Option 3">
            </div>
            <select id="corrIdx" style="margin-bottom:15px"><option value="0">Option 1 Correct</option><option value="1">Option 2 Correct</option><option value="2">Option 3 Correct</option></select>
            <button type="submit" class="btn-sub">🚀 Publish Full Module</button>
        </form>
    </div>
    <div class="tabs">
        <button id="defaultTab" onclick="loadLessons('', this)" class="active">All Courses</button>
        <button onclick="loadLessons('English', this)">English</button>
        <button onclick="loadLessons('AI', this)">AI</button>
        <button onclick="loadLessons('Earning', this)">Earning</button>
    </div>
    <div id="lessonsGrid" class="grid"></div>
</main>
<script>
    fetch('/api/convert?usd=1').then(res=>res.json()).then(d=>{document.getElementById('exchangeStatus').innerText=`$1.00 USD = ${d.convertedPkr} PKR`;});

    function loadLessons(cat, btn) {
        if(btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');}
        fetch(`/api/lessons?category=${encodeURIComponent(cat)}`).then(res=>res.json()).then(data=>{
            const g = document.getElementById('lessonsGrid'); g.innerHTML = '';
            data.forEach(l=>{
                let opts = '';
                l.quizOptions.forEach((o, i) => {
                    opts += `<button onclick="checkAnswer(${l.id}, ${i}, ${l.correctOptionIndex})" class="qz-opt" id="opt-${l.id}-${i}">${o}</button>`;
                });
                g.innerHTML += `<div class="card"><div class="card-hd"><span class="tag">${l.category}</span><button onclick="deleteLesson(${l.id})" class="btn-del">✕ Delete</button></div><h3>${l.title}</h3><p style="color:#cbd5e1;font-size:0.9rem">${l.content}</p><div class="tip">💡 ${l.interactiveTip}</div><div class="qz"><strong>📝 Quiz Challenge:</strong><div style="font-size:0.85rem;color:#94a3b8;margin-top:4px">${l.quizQuestion}</div><div>${opts}</div><div class="qz-fb" id="fb-${l.id}"></div></div></div>`;
            });
        });
    }

    function checkAnswer(id, ch, corr) {
        const fb = document.getElementById(`fb-${id}`); fb.style.display = "block";
        for(let i=0; i<3; i++) { const b = document.getElementById(`opt-${id}-${i}`); if(b) b.style.borderColor="#475569"; }
        const sel = document.getElementById(`opt-${id}-${ch}`);
        if(ch === corr) { fb.style.background="rgba(16,185,129,0.15)"; fb.style.color="#34d399"; fb.innerText="🎯 Correct! Excellent job."; if(sel) sel.style.borderColor="#10b981"; }
        else { fb.style.background="rgba(239,68,68,0.15)"; fb.style.color="#f87171"; fb.innerText="❌ Incorrect. Try again!"; if(sel) sel.style.borderColor="#ef4444"; }
    }

    function createNewLesson(e) {
        e.preventDefault();
        const params = `category=${encodeURIComponent(document.getElementById('formCategory').value)}&title=${encodeURIComponent(document.getElementById('formTitle').value)}&content=${encodeURIComponent(document.getElementById('formContent').value)}&tip=${encodeURIComponent(document.getElementById('formTip').value)}&quizQuestion=${encodeURIComponent(document.getElementById('qzQ').value)}&opt0=${encodeURIComponent(document.getElementById('o0').value)}&opt1=${encodeURIComponent(document.getElementById('o1').value)}&opt2=${encodeURIComponent(document.getElementById('o2').value)}&correctIdx=${document.getElementById('corrIdx').value}`;

        fetch(`/api/lessons/add?${params}`).then(res=>res.json()).then(()=>{
            // Reset form fields completely
            document.getElementById('formTitle').value=''; document.getElementById('formContent').value=''; document.getElementById('formTip').value=''; document.getElementById('qzQ').value=''; document.getElementById('o0').value=''; document.getElementById('o1').value=''; document.getElementById('o2').value='';

            // Fixed: Explicitly force re-rendering to display 'All Courses' category view on immediate update
            const allBtn = document.getElementById('defaultTab');
            loadLessons('', allBtn);
        });
    }

    function deleteLesson(id) {
        if(prompt("🔐 Enter Admin Code:") === "12345") {
            fetch(`/api/lessons/delete?id=${id}`).then(res=>res.json()).then(()=>{
                const allBtn = document.getElementById('defaultTab');
                loadLessons('', allBtn);
                alert("🗑️ Removed.");
            });
        } else { alert("❌ Access Denied!"); }
    }
    loadLessons('');
</script>
</body>
</html>
