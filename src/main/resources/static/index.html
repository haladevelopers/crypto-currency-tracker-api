<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sindh Academy</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { background:#0f172a; color:#fff; font-family:sans-serif; margin:0; padding-bottom:40px; }
        header { background:linear-gradient(to right, #f59e0b, #dc2626); padding:20px; text-align:center; position:relative; }
        main { max-width:800px; margin:0 auto; padding:20px; }
        .stats { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:15px; margin-bottom:20px; display:flex; justify-content:space-between; }
        .form-sec { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:20px; margin-bottom:20px; }
        .form-row { display: flex; gap:10px; margin-bottom:10px; }
        input, select, textarea { width:100%; background:#0f172a; border:1px solid #334155; border-radius:6px; padding:8px; color:#fff; box-sizing:border-box; outline:none; }
        .btn-sub { width:100%; background:#059669; color:#fff; font-weight:bold; padding:12px; border:none; border-radius:6px; cursor:pointer; }
        .tabs { display:flex; gap:10px; margin-bottom:20px; overflow-x:auto; border-bottom:1px solid #334155; padding-bottom:10px; }
        .tabs button { background:#1e293b; border:1px solid #334155; color:#fff; padding:6px 16px; border-radius:6px; cursor:pointer; }
        .tabs button.active { background:#fbbf24; color:#0f172a; font-weight:bold; }
        .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
        .card { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
        .card-hd { display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.8rem; }
        .tag { color: #fbbf24; font-weight: bold; }
        .btn-del { background:none; border:none; color:#64748b; cursor:pointer; font-weight:bold; }
        .btn-del:hover { color:#ef4444; }
        .tip { background:rgba(251,191,36,0.1); border:1px solid rgba(251,191,36,0.2); color:#fde047; padding:10px; border-radius:6px; font-size:0.85rem; margin-top:10px; }
        .qz { background:#0f172a; padding:12px; border-radius:6px; border:1px solid #475569; margin-top:10px; }
        .qz-opt { width:100%; text-align:left; background:#1e293b; border:1px solid #475569; padding:8px; color:#fff; border-radius:4px; margin-top:6px; cursor:pointer; font-size:0.85rem; }
        .qz-fb { font-size:0.85rem; font-weight:bold; margin-top:8px; padding:6px; border-radius:4px; display:none; }
        .lang-btn { position:absolute; top:20px; right:20px; background:#0f172a; color:#fbbf24; border:2px solid #fbbf24; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer; }
        .rtl { direction:rtl; font-family:'Noto Naskh Arabic', sans-serif; }
    </style>
</head>
<body>
<header>
    <button onclick="toggleLang()" class="lang-btn" id="lBtn">سنڌي ۾ تبديل ڪريو</button>
    <h1 id="t1">HALA LITERACY ACADEMY</h1>
    <p id="t2">Empowering the youth of Sindh with Free English, AI & Digital Skills 🌟</p>
</header>
<main id="mCont">
    <div class="stats">
        <div><small id="lCurr" style="color:#94a3b8">PLATFORM CURRENCY STATUS</small><div id="exchangeStatus" style="font-weight:bold;color:#fbbf24">Loading...</div></div>
        <div id="lFree" style="background:#334155;padding:6px;border-radius:6px;color:#10b981;font-weight:bold">FREE</div>
    </div>
    <div class="form-sec">
        <h3 style="margin:0 0 10px 0;color:#fbbf24" id="lForm">➕ Add New Academy Lesson & Quiz</h3>
        <form onsubmit="createNewLesson(event)">
            <div class="form-row">
                <select id="formCategory" style="flex:1"><option value="English">English</option><option value="AI">AI</option><option value="Earning">Earning</option></select>
                <input type="text" id="formTitle" style="flex:2" required placeholder="Lesson Topic / Title">
            </div>
            <textarea id="formContent" required rows="2" placeholder="Lesson content details..." style="margin-bottom:10px"></textarea>
            <input type="text" id="formTip" required placeholder="Interactive teacher tip..." style="margin-bottom:10px">
            <input type="text" id="qzQ" required placeholder="Quiz Question..." style="margin-bottom:10px">
            <div class="form-row">
                <input type="text" id="o0" required placeholder="Option 1">
                <input type="text" id="o1" required placeholder="Option 2">
                <input type="text" id="o2" required placeholder="Option 3">
            </div>
            <select id="corrIdx" style="margin-bottom:15px"><option value="0" id="c0">Option 1 Correct</option><option value="1" id="c1">Option 2 Correct</option><option value="2" id="c2">Option 3 Correct</option></select>
            <button type="submit" class="btn-sub" id="lPub">🚀 Publish Full Module</button>
        </form>
    </div>
    <div class="tabs" id="tRow">
        <button id="all-btn" onclick="loadLessons('', this)" class="active">All Courses</button>
        <button onclick="loadLessons('English', this)">English</button>
        <button onclick="loadLessons('AI', this)">AI</button>
        <button onclick="loadLessons('Earning', this)">Earning</button>
    </div>
    <div id="lessonsGrid" class="grid"></div>
</main>
<script>
    let curCat = ''; let curLang = 'EN';
    const dict = {
        EN: { t1:"HALA LITERACY ACADEMY", t2:"Empowering the youth of Sindh with Free English, AI & Digital Skills 🌟", lCurr:"PLATFORM CURRENCY STATUS", lFree:"FREE", lForm:"➕ Add New Academy Lesson & Quiz", lPub:"🚀 Publish Full Module", lBtn:"سنڌي ۾ تبديل ڪريو", qHead:"📝 Quiz Challenge:", cMsg:"🎯 Correct! Excellent job.", iMsg:"❌ Incorrect. Try again!", dBtn:"✕ Delete", c0:"Option 1 Correct", c1:"Option 2 Correct", c2:"Option 3 Correct" },
        SD: { t1:"هالا لٽريسي اڪيڊمي", t2:"سنڌ جي نوجوانن کي مفت انگريزي، اي آئي ۽ ڊجيٽل مهارتن سان بااختيار بڻائڻ 🌟", lCurr:"پليٽ فارم ڪرنسي جي صورتحال", lFree:"مفت", lForm:"➕ نئون سبق ۽ ڪوئز شامل ڪريو", lPub:"🚀 مڪمل ماڊل شايع ڪريو", lBtn:"English", qHead:"📝 ڪوئز چيلنج:", cMsg:"🎯 صحيح جواب! تمام بهترين.", iMsg:"❌ غلط جواب. ٻيهر ڪوشش ڪريو!", dBtn:"✕ ختم ڪريو", c0:"آپشن 1 صحيح", c1:"آپشن 2 صحيح", c2:"آپشن 3 صحيح" }
    };
    const trans = {
        "Mastering the Present Continuous Tense": "پريزنٽ ڪنٽينيوئس ٽينس تي عبور حاصل ڪريو",
        "Use this tense for actions happening right now! Structure: Subject + am/is/are + Verb(ing). Example: 'I am learning code right now.'": "هي ٽينس انهن ڪمن لاءِ استعمال ٿيندو آهي جيڪي هن وقت ٿي رهيا هجن! بناوت: فاعل + am/is/are + فيعل(ing). مثال: 'مان هن وقت ڪوڊ سکي رهيويان.'",
        "Tip: Look around your room and say out loud what your family members are doing!": "ٽپ: پنهنجي ڪمري جي چوڌاري ڏسو ۽ آواز سان چئو ته گهر وارا ڇا ڪري رهيا آهن!",
        "Identify the correct Present Continuous statement below:": "هيٺ ڏنل جملن مان صحيح جملو سڃاڻو:",
        "He runs to school yesterday.": "هو ڪلهه اسڪول ڊوڙي ٿو.",
        "She is speaking English beautifully.": "هوءَ تمام خوبصورتي سان انگريزي ڳالهائي رهي آهي.",
        "They will study tomorrow.": "اهي سڀاڻي پڙهندا.",
        "Introduction to Prompt Engineering": "پرامپٽ انجنيئرنگ جو تعارف",
        "AI outputs are only as good as your inputs. Always give the AI a Role, a Task, and a Context. Example: 'Act as a professional English tutor...'": "اي آئي جو جواب توهان جي سوال تي مدار رکي ٿو. هميشه اي آئي کي ڪردار ۽ ڪم ڏيو.",
        "Tip: Try starting your next query with 'Act as an expert software tester'!": "ٽپ: پنهنجو ايندڙ سوال 'Act as an expert software tester' سان شروع ڪري ڏسو!",
        "What are the three essential components of a perfect foundational AI prompt?": "اي آئي پرامپٽ جا ٽي اهم حصا ڪهڙا آهن؟",
        "Role, Task, and Context": "ڪردار، ڪم، ۽ پس منظر",
        "Username, Password, and Code": "يوزرنام، پاسورڊ، ۽ ڪوڊ",
        "Laptop, Internet, and Browser": "ليپ ٽاپ، انٽرنيٽ، ۽ برائوزر"
    };
    function getT(txt) { return (curLang === 'SD' && trans[txt]) ? trans[txt] : txt; }
    fetch('/api/convert?usd=1').then(res=>res.json()).then(d=>{document.getElementById('exchangeStatus').innerText=`$1.00 USD = ${d.convertedPkr} PKR`;});
    function loadLessons(cat, btn) {
        curCat = cat; if(btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');}
        fetch(`/api/lessons?category=${encodeURIComponent(cat)}`).then(res=>res.json()).then(data=>{
            const g = document.getElementById('lessonsGrid'); g.innerHTML = ''; const d = dict[curLang];
            data.forEach(l=>{
                let opts = ''; l.quizOptions.forEach((o, i) => { opts += `<button onclick="checkAnswer(${l.id}, ${i}, ${l.correctOptionIndex})" class="qz-opt" id="opt-${l.id}-${i}">${getT(o)}</button>`; });
                g.innerHTML += `<div class="card"><div class="card-hd"><span class="tag">${l.category}</span><button onclick="deleteLesson(${l.id})" class="btn-del">${d.dBtn}</button></div><h3>${getT(l.title)}</h3><p style="color:#cbd5e1;font-size:0.9rem">${getT(l.content)}</p><div class="tip">💡 ${getT(l.interactiveTip)}</div><div class="qz"><strong>${d.qHead}</strong><div style="font-size:0.85rem;color:#94a3b8;margin-top:4px">${getT(l.quizQuestion)}</div><div>${opts}</div><div class="qz-fb" id="fb-${l.id}"></div></div></div>`;
            });
        });
    }
    function toggleLang() {
        curLang = (curLang === 'EN') ? 'SD' : 'EN'; const d = dict[curLang];
        document.getElementById('lBtn').innerText = d.lBtn;
        document.getElementById('t1').innerHTML = d.t1;
        document.getElementById('t2').innerText = d.t2;
        document.getElementById('lCurr').innerText = d.lCurr;
        document.getElementById('lFree').innerText = d.lFree;
        document.getElementById('lForm').innerText = d.lForm;
        document.getElementById('lPub').innerText = d.lPub;
        document.getElementById('c0').innerText = d.c0;
        document.getElementById('c1').innerText = d.c1;
        document.getElementById('c2').innerText = d.c2;
        if(curLang === 'SD') {
            document.body.classList.add('rtl');
            document.getElementById('mCont').classList.add('rtl');
            document.getElementById('tRow').style.flexDirection = "row-reverse";
        } else {
            document.body.classList.remove('rtl');
            document.getElementById('mCont').classList.remove('rtl');
            document.getElementById('tRow').style.flexDirection = "row";
        }
        loadLessons(curCat, document.querySelector('.tabs button.active'));
    }
    loadLessons('');
</script>
</body>
</html>
