# 💾 Automatic Internal Embedded H2 Database Configuration Profile
spring.datasource.url=jdbc:h2:file:./data/hala_academy_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=root

# ⚙️ Automated Database Generation & Visual Web Console Management
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
